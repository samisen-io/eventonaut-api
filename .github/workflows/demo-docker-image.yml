name: Docker Image CI

on:
  pull_request:
    types:
      - closed
    branches: [ "Demo" ]

permissions:
  id-token: write
  contents: read
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Login to Azure Container Registry
      id: Login_to_Azure_Container_Registry
      uses: docker/login-action@v1.10.0
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.username }}
        password: ${{ secrets.password }}

    - name: Check Login to Azure Container Registry
      run: echo "Login to Azure Container Registry outcome:${{ steps.Login_to_Azure_Container_Registry.outcome }}"

    - uses: actions/checkout@v3

    - name: Build the Docker image
      id: Build_the_Docker_image
      run: docker build -t demo-eventonaut-data-api-image .  

    - name: Check Build the Docker image
      run: echo "Build the Docker image outcome:${{ steps.Build_the_Docker_image.outcome }}"

    - name: Create tag
      id: Create_tag
      run: |
        docker tag demo-eventonaut-data-api-image ${{ secrets.registry }}/demo-eventonaut-data-api-image:demo-build-${{ github.run_number }}-pr-${{ github.event.pull_request.number }}

    - name: Check Create tag
      run: echo "Create tag outcome:${{ steps.Create_tag.outcome }}"

    - name: Push Docker image to Azure Container Registry
      id: Push_Docker_image_to_Azure_Container_Registry
      run: |
        docker push ${{ secrets.registry }}/demo-eventonaut-data-api-image:demo-build-${{ github.run_number }}-pr-${{ github.event.pull_request.number }}

    - name: Check Push Docker image to Azure Container Registry
      run: echo "Push Docker image to Azure Container Registry outcome:${{ steps.Push_Docker_image_to_Azure_Container_Registry.outcome }}"

    - name: Deploy to Azure App Service
      id: Deploy_to_Azure_App_Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: '${{ secrets.DEMO_APP_NAME }}'
        slot-name: 'production'
        publish-profile: ${{ secrets.DEMO_PUBLISH_PROFILE }}
        images: 'eventonaut.azurecr.io/demo-eventonaut-data-api-image:demo-build-${{ github.run_number }}-pr-${{ github.event.pull_request.number }}'

    - name: Check Deploy to Azure App Service
      run: echo "Deploy to Azure App Service outcome:${{ steps.Deploy_to_Azure_App_Service.outcome }}"
      
    - name: Check API status
      id: Check_API_status
      run: |
        status=$(curl -o /dev/null -s -w "%{http_code}\n" ${{ secrets.DEMO_EVENTONAUT_DATA_API_URL }})
        if [ "$status" -ne 200 ]; then
          echo "API check failed with status $status"
          exit 1
        fi
        
    - name: Notify on success
      if: success()
      run: |
        curl -X POST -H "Content-Type: application/json" -d @- "${{ secrets.DEMO_GOOGLE_CHAT_WEBHOOK_URL}}" <<EOF
        {
          "text": "eventonaut data api deployment successful for PR ${{ github.event.pull_request.number }}\n\n| _API link_ | ${{ secrets.DEMO_EVENTONAUT_DATA_API_URL }}/docs |\n| _PR link_ | ${{ secrets.GITHUB_PULL_REQUESTS_URL }}/${{ github.event.pull_request.number }} |"
        }
        EOF
      
    - name: Notify on failure
      if: failure()
      run: |
        curl -X POST -H "Content-Type: application/json" -d @- "${{ secrets.DEMO_GOOGLE_CHAT_WEBHOOK_URL}}" <<EOF
        {
          "text": "Eventonaut data api deployment failed for PR ${{ github.event.pull_request.number }}\n\n| _Login to Azure Container Registry step outcome_ | ${{ steps.Login_to_Azure_Container_Registry.outcome }} |\n| _Build the Docker image step outcome_ | ${{ steps.Build_the_Docker_image.outcome }} |\n| _Create tag step outcome_ | ${{ steps.Create_tag.outcome }} |\n| _Push Docker image to Azure Container Registry step outcome_ | ${{ steps.Push_Docker_image_to_Azure_Container_Registry.outcome }} |\n| _Deploy to Azure App Service step outcome_ | ${{ steps.Deploy_to_Azure_App_Service.outcome }} |\n| _Check API status step outcome_ | ${{ steps.Check_API_status.outcome }} |\n| _PR link_ | ${{ secrets.GITHUB_PULL_REQUESTS_URL }}/${{ github.event.pull_request.number }} | "
        }
        EOF
