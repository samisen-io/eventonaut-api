name: Docker Image CI

on:
  push:
    branches: [ "test" ]
  pull_request:
    types:
      - closed
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Login to Azure
      run: |
        az login --service-principal -u ${{ secrets.AZURE_APP_ID }} -p ${{ secrets.AZURE_PASSWORD }} --tenant ${{ secrets.AZURE_TENANT_ID }}

    - name: Login to Azure Container Registry
      id: Login_to_Azure_Container_Registry
      uses: docker/login-action@v1.10.0
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.username }}
        password: ${{ secrets.password }}

    - name: Check Login to Azure Container Registry
      run: echo "Login to Azure Container Registry outcome:${{ steps.Login_to_Azure_Container_Registry.outcome }}"

    - uses: actions/checkout@v3
    
    - name: Delete all previous images from Azure Container Registry
      id: Delete_all_previous_images_from_Azure_Container_Registry
      run: |
        az acr repository delete --name ${{ secrets.registry }} --image eventonaut-data-api-image --yes
