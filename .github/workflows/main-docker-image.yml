name: Docker Image CI

on:
  push:
    branches: [ "feat-photobooth" ]
  pull_request:
    types:
      - closed
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Login to Azure Container Registry
      id: Login_to_Azure_Container_Registry
      uses: docker/login-action@v1.10.0
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.username }}
        password: ${{ secrets.password }}

    - name: Check Login to Azure Container Registry
      run: echo "Login to Azure Container Registry outcome:${{ steps.Login_to_Azure_Container_Registry.outcome }}"

    - uses: actions/checkout@v3

    - name: Build the Docker image
      id: Build_the_Docker_image
      run: docker build -t eventonaut-data-api-image .  

    - name: Check Build the Docker image
      run: echo "Build the Docker image outcome:${{ steps.Build_the_Docker_image.outcome }}"

    - name: Create tag
      id: Create_tag
      run: |
        docker tag eventonaut-data-api-image ${{ secrets.registry }}/eventonaut-data-api-image:main-build-${{ github.run_number }}-pr-${{ github.event.pull_request.number }}

    - name: Check Create tag
      run: echo "Create tag outcome:${{ steps.Create_tag.outcome }}"

    - name: Push Docker image to Azure Container Registry
      id: Push_Docker_image_to_Azure_Container_Registry
      run: |
        docker push ${{ secrets.registry }}/eventonaut-data-api-image:main-build-${{ github.run_number }}-pr-${{ github.event.pull_request.number }}

    - name: Check Push Docker image to Azure Container Registry
      run: echo "Push Docker image to Azure Container Registry outcome:${{ steps.Push_Docker_image_to_Azure_Container_Registry.outcome }}"

    - name: Deploy to Azure App Service
      id: Deploy_to_Azure_App_Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'event-data-api'
        slot-name: 'production'
        publish-profile: <publishData><publishProfile profileName="event-data-api - Web Deploy" publishMethod="MSDeploy" publishUrl="event-data-api.scm.azurewebsites.net:443" msdeploySite="event-data-api" userName="$event-data-api" userPWD="nh7iY3jmLMKZFEZe7oo79ndQenP6WZSn8AWLYCsQpr1pgiJF2ti2WMiwRpZ0" destinationAppUrl="https://event-data-api.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="event-data-api - FTP" publishMethod="FTP" publishUrl="ftps://waws-prod-blu-485.ftp.azurewebsites.windows.net/site/wwwroot" ftpPassiveMode="True" userName="event-data-api\$event-data-api" userPWD="nh7iY3jmLMKZFEZe7oo79ndQenP6WZSn8AWLYCsQpr1pgiJF2ti2WMiwRpZ0" destinationAppUrl="https://event-data-api.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="event-data-api - Zip Deploy" publishMethod="ZipDeploy" publishUrl="event-data-api.scm.azurewebsites.net:443" userName="$event-data-api" userPWD="nh7iY3jmLMKZFEZe7oo79ndQenP6WZSn8AWLYCsQpr1pgiJF2ti2WMiwRpZ0" destinationAppUrl="https://event-data-api.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="https://portal.azure.com" webSystem="WebSites"><databases /></publishProfile></publishData>
        images: 'eventonaut.azurecr.io/eventonaut-data-api-image:main-build-${{ github.run_number }}-pr-${{ github.event.pull_request.number }}'

    - name: Check Deploy to Azure App Service
      run: echo "Deploy to Azure App Service outcome:${{ steps.Deploy_to_Azure_App_Service.outcome }}"
      
    - name: Check API status
      id: Check_API_status
      run: |
        status=$(curl -o /dev/null -s -w "%{http_code}\n" ${{ secrets.EVENTONAUT_DATA_API_URL}})
        if [ "$status" -ne 200 ]; then
          echo "API check failed with status $status"
          exit 1
        fi
        
    # - name: Notify on success
    #   if: success()
    #   run: |
    #     curl -X POST -H "Content-Type: application/json" -d @- "${{ secrets.GOOGLE_CHAT_WEBHOOK_URL}}" <<EOF
    #     {
    #       "text": "eventonaut data api deployment successful for PR ${{ github.event.pull_request.number }}\n\n| _API link_ | ${{ secrets.EVENTONAUT_DATA_API_URL}}/docs |\n| _PR link_ | ${{ secrets.PULL_REQUESTS_URL }}/${{ github.event.pull_request.number }} |"
    #     }
    #     EOF
      
