name: Docker Image CI

on:
  push:
    branches: [ "test-script" ]
  pull_request:
    branches: [ "test-script" ]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  ALGORITHM: ${{ secrets.ALGORITHM }}
  ORGANIZER_ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ORGANIZER_ACCESS_TOKEN_EXPIRE_MINUTES }}
  ATTENDEE_ACCESS_TOKEN_EXPIRE_DAYS: ${{ secrets.ATTENDEE_ACCESS_TOKEN_EXPIRE_DAYS }}
  ORGANIZER_REFRESH_TOKEN_EXPIRE_MINUTES: ${{ secrets.ORGANIZER_REFRESH_TOKEN_EXPIRE_MINUTES }}
  ATTENDEE_REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.ATTENDEE_REFRESH_TOKEN_EXPIRE_DAYS }}
  DATABASE_URL_ADDRESS: ${{ secrets.DATABASE_URL_ADDRESS }}
  sqlalchemy.url: ${{ secrets.SQLALCHEMY_URL }}
  EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
  OTP_EXPIRE: ${{ secrets.OTP_EXPIRE }}
  REFRESH_TOKEN_SECRET_KEY: ${{ secrets.REFRESH_TOKEN_SECRET_KEY }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_API_ENV: ${{ secrets.PINECONE_API_ENV }}
  PINECONE_API_INDEX: ${{ secrets.PINECONE_API_INDEX }}
  AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    #- uses: actions/checkout@v3

    #- name: Login to Azure
      #uses: azure/login@v1
      #run: |
       # az login -u abhishek@samisen.io -p MicrosoftAzure26842580#
        
      #with:
       # creds: '{"clientId": "a384ad8b-1975-4ecf-be7b-9295af9b1ead", "clientSecret": "e3aafe1e-5335-4e40-99cf-05a77d28e943", "subscriptionId": "9a1facf0-c31b-44a2-a3cd-11bfaa85f05d", "tenantId": "3f699e49-baba-42b2-9990-887b23ed895d"}'
    
    - name: Login to Azure Container Registry
      uses: docker/login-action@v1 
      with:
        registry: ${{ secrets.registry }}
        username: ${{ secrets.username }}
        password: ${{ secrets.password }}
        
    - uses: actions/checkout@v3   
    - name: Build the Docker image
      run: docker build -t eventonaut-data-api-image . 

    - name: create tag
      run: |
        docker tag eventonaut-data-api-image ${{ secrets.registry }}/eventonaut-data-api-image:pr-${{ github.event.pull_request.number }}

    - name: Push Docker image to Azure Container Registry
      run: |
        docker push ${{ secrets.registry }}/eventonaut-data-api-image:pr-${{ github.event.pull_request.number }}

