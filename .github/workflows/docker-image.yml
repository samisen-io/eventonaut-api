name: Docker Image CI

on:
  push:
    branches: [ "test-script" ]
  pull_request:
    branches: [ "test-script" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build the Docker image
      run: docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/eventonaut-data-api-image:latest .

    - name: Login to Azure Container Registry
      uses: docker/login-action@v1 
      with:
        registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Push Docker image to Azure Container Registry
      run: |
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/eventonaut-data-api-image:latest

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'your-app-name'
        slot-name: 'production'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/eventonaut-data-api-image:latest'

    - name: Restart Azure App Service
      run: |
        az webapp restart --name your-app-name --resource-group your-resource-group
